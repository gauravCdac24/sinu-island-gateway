# Staging: single public port 3000 → Nginx (SPA) + /api → Express on :7000 inside the stack.
# Usage: docker compose -f docker-compose-staging.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
      args:
        MODE: staging
        VITE_API_URL: /api
    container_name: sinu-app-staging
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: staging
    volumes:
      - ./nginx/staging/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/staging/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs_staging:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sinu-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sinu-api-staging
    restart: unless-stopped
    expose:
      - "7000"
    environment:
      NODE_ENV: staging
      HOST: 0.0.0.0
      PORT: "7000"
      DATABASE_URL: postgresql://sinu:sinu_staging@postgres:5432/sinu_gateway?schema=public
    volumes:
      - ./data/policies:/seed/policies:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sinu-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: sinu-postgres-staging
    restart: unless-stopped
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sinu
      POSTGRES_PASSWORD: sinu_staging
      POSTGRES_DB: sinu_gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinu -d sinu_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sinu-network

networks:
  sinu-network:
    driver: bridge

volumes:
  postgres_data_staging:
  nginx_logs_staging:
