name: CI and staging deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Production build (Vite)
        run: npm run build

  # checkout@v4 wipes the workspace first; root-owned nginx/logs (old bind mount) cannot be unlinked
  # by the runner user. Stop the stack so nginx stops recreating logs, then sudo rm, then checkout.
  # Requires passwordless sudo for the runner account.
  deploy-staging:
    name: Deploy staging (Docker Compose)
    needs: [test]
    runs-on: [self-hosted, sinuwebsite]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Stop staging stack and remove root-owned nginx logs (before checkout)
        env:
          COMPOSE_PROJECT_NAME: sinu-staging
        run: |
          set +e
          WS="${GITHUB_WORKSPACE}"
          # Stop containers even if compose file is missing from workspace (recreates root-owned ./nginx/logs).
          docker stop sinu-app-staging sinu-api-staging 2>/dev/null
          cd "$WS" 2>/dev/null || true
          if [ -f docker-compose-staging.yml ]; then
            docker compose -f docker-compose-staging.yml down --remove-orphans 2>/dev/null
          fi
          sudo rm -rf "$WS/nginx/logs" 2>/dev/null
          exit 0

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build and start containers
        env:
          COMPOSE_PROJECT_NAME: sinu-staging
        run: |
          set -euo pipefail
          docker compose -f docker-compose-staging.yml build
          docker compose -f docker-compose-staging.yml up -d --force-recreate
          docker compose -f docker-compose-staging.yml ps

      - name: Smoke check (frontend + API via nginx)
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS "http://127.0.0.1:3000/health" | head -c 200
          echo ""
          curl -fsS "http://127.0.0.1:3000/api/health" | head -c 200
          echo ""

      - name: Post-deploy (seed policies + optional commands)
        env:
          POST_DEPLOY_EXTRA_COMMANDS: ${{ secrets.POST_DEPLOY_EXTRA_COMMANDS }}
        run: |
          set -euo pipefail
          chmod +x scripts/post-deploy-staging.sh
          ./scripts/post-deploy-staging.sh

  # Optional: use this job instead of deploy-staging if you deploy from GitHub-hosted runners over SSH.
  # Uncomment and set secrets: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY, STAGING_DEPLOY_PATH
  # deploy-staging-ssh:
  #   needs: [test]
  #   runs-on: ubuntu-latest
  #   if: false
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Deploy over SSH
  #       uses: appleboy/ssh-action@v1.2.0
  #       with:
  #         host: ${{ secrets.STAGING_HOST }}
  #         username: ${{ secrets.STAGING_USER }}
  #         key: ${{ secrets.STAGING_SSH_KEY }}
  #         script: |
  #           set -e
  #           cd ${{ secrets.STAGING_DEPLOY_PATH }}
  #           git pull origin main
  #           docker compose -f docker-compose-staging.yml up -d --build
