version: "3.9"

services:
  # Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        NODE_ENV: production
    image: gauravsingh1998/sinu-frontend:${FRONTEND_TAG:-latest}
    restart: always
    expose:
      - "5173"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_APP_NAME: ${VITE_APP_NAME:-Sinu}
    networks:
      - sinu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://10.80.210.65:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  api:
    image: gauravsingh1998/sinu-api:${API_TAG:-latest}
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/sinu-production}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-https://yourdomain.com}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - sinu-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data_production:/data/db
      - ./mongo-backup:/backup
    environment:
      MONGO_INITDB_DATABASE: sinu-production
    command: [--auth]
    networks:
      - sinu-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/production/conf.d:/etc/nginx/conf.d
      - ./ssl/production:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - api
    networks:
      - sinu-network
    restart: unless-stopped

  # Optional: Redis cache for production
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - sinu-network

networks:
  sinu-network:
    driver: bridge

volumes:
  mongo_data_production:
  redis_data: