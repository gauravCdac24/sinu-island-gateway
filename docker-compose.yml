version: "3.9"

services:
  # Vite Frontend
  frontend:
    build:
      context: .
      dockerfile: dockerfile
      args:
        MODE: production
    image: gauravsingh1998/sinu-frontend:${FRONTEND_TAG:-latest}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/production/conf.d:/etc/nginx/conf.d
      - ./ssl/production:/etc/nginx/ssl
      - nginx_logs_production:/var/log/nginx
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_APP_NAME: ${VITE_APP_NAME:-Sinu}
    networks:
      - sinu-network
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  api:
    image: gauravsingh1998/sinu-api:${API_TAG:-latest}
    restart: always
    expose:
      - "7000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sinu:sinu@postgres:5432/sinu_production?schema=public}
      PORT: 7000
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:-https://yourdomain.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sinu-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data_production:/var/lib/postgresql/data
      - ./pg-backup:/backup
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sinu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sinu}
      POSTGRES_DB: ${POSTGRES_DB:-sinu_production}
    networks:
      - sinu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinu -d sinu_production"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Optional: Redis cache for production
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - sinu-network

networks:
  sinu-network:
    driver: bridge

volumes:
  postgres_data_production:
  redis_data:
  nginx_logs_production:
